name: Build and Deploy

# Requires repo secrets:
#   - FIREBASE_SERVICE_ACCOUNT: JSON key of a service account with the
#     "Firebase Hosting Admin" role
#   - GA_TRACKING_ID: Google Analytics measurement ID (live deploys only; optional
#     for the build, the check-ga job warns and opens an issue if the live site lacks it)
# and repo variable:
#   - FIREBASE_PROJECT_ID: Firebase project to deploy to. A variable, not a
#     secret, so the preview URL (which contains it) isn't masked in logs.
#
# master deploys to the live site; claude-experiments deploys to a 7-day
# Firebase preview channel. Both run every check first.
on:
  push:
    branches:
      - master
      - claude-experiments
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      # Claude-only files (they stay on claude-experiments, see CLAUDE.md)
      - '**/CLAUDE.md'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # superseded previews can be dropped; never cancel a live deploy midway
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24, not 26: firebase-tools (via superstatic) only supports Node 20-24,
          # and .npmrc engine-strict turns that into an install error
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm test

      # no --with-deps: the runner image already has what Chromium needs
      - run: npx playwright install chromium
        timeout-minutes: 5

      # builds without the GA ID, so CI page loads don't reach Analytics
      - run: npm run test:e2e

      - name: Build
        env:
          # previews get no GA, so they don't count as site traffic
          PUBLIC_GA_TRACKING_ID: ${{ github.ref == 'refs/heads/master' && secrets.GA_TRACKING_ID || '' }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.ref == 'refs/heads/master' && 'live' || 'claude-experiments' }}
          expires: 7d
          # pinned: the action defaults to firebase-tools@latest, run with the deploy key.
          # Dependabot can't see this input, so bump it by hand (npm view firebase-tools version).
          firebaseToolsVersion: 15.36.0

      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"

  check-ga:
    # Live deploys only (previews are built without GA). Also checks every card image
    # loads with the live Referer. Never fails the run for either: warns, and tracks each
    # problem in its own open issue that closes itself once fixed.
    if: github.ref == 'refs/heads/master'
    needs: build-and-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: GA missing on live site
      # fixed, not the deploy step's details_url: Actions drops that job output
      # because it looks like it may contain a secret
      SITE_URL: https://dna.darthvid.com/
      GA_ID: ${{ secrets.GA_TRACKING_ID }}
      IMG_ISSUE_TITLE: Card images failing on live site
    steps:
      # for deck.json, read by the image check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check live page for GA tag
        run: |
          short="${GITHUB_SHA::7}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$SITE_URL" ]; then
            echo "::warning::No site URL from the deploy job; skipped the GA check"
            exit 0
          fi

          # The CDN can serve the previous build for a while, so wait until the
          # page shows this commit (up to ~10 min). The query string busts caches.
          page=''
          for i in $(seq 1 20); do
            page="$(curl -fsSL --max-time 20 "${SITE_URL%/}/?ga-check=$GITHUB_RUN_ID-$i" || true)"
            grep -qF "$short" <<<"$page" && break
            page=''
            sleep 30
          done
          if [ -z "$page" ]; then
            echo "::warning::$SITE_URL never showed build $short; skipped the GA check"
            exit 0
          fi

          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"

          if [ -n "$GA_ID" ] && grep -qF "googletagmanager.com/gtag/js?id=$GA_ID" <<<"$page"; then
            echo "GA tag present on $SITE_URL (build $short)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "GA is back on $SITE_URL as of $GITHUB_SHA ($run_url)."
            fi
            exit 0
          fi

          echo "::warning::GA tag missing on $SITE_URL (build $short)"
          body="The GA tag is missing on $SITE_URL after deploying $GITHUB_SHA ($run_url)."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still missing. $body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"$'\n\n'"Check that the GA ID repo secret is set and that the build reads it. This issue closes itself once a deploy has GA again."
          fi

      # The only real image-load test: Vitest only checks URL format, and the e2e
      # tests run on localhost, which the S3 bucket's Referer rule blocks. Runs even
      # if the page check above skipped, since the images don't depend on the deploy.
      - name: Check card images load with the live Referer
        if: ${{ !cancelled() }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          total=0
          failed=''
          while IFS=$'\t' read -r title kind url; do
            total=$((total + 1))
            res="$(curl -sS -o /dev/null --max-time 30 --retry 2 -H "Referer: $SITE_URL" \
              -w '%{http_code} %{content_type}' "$url" 2>&1 || true)"
            code="${res%% *}"
            ctype="${res#* }"
            if [ "$code" != 200 ] || [[ "$ctype" != image/* ]]; then
              failed+="- $title ($kind): ${res:-no response} $url"$'\n'
            fi
          done < <(jq -r '.[] | .title as $t | (["full", .imgURL], ["thumb", .thumbURL])
            | select(.[1] != null) | [$t, .[0], .[1]] | @tsv' src/lib/data/deck.json)
          nfail="$(grep -c . <<<"$failed" || true)"
          summary="$((total - nfail)) of $total card images (full-size + thumbnails) load with Referer $SITE_URL"
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.IMG_ISSUE_TITLE)) | .[0].number // empty')"

          if [ "$total" -gt 0 ] && [ "$nfail" -eq 0 ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All $total card images load again as of $GITHUB_SHA ($run_url)."
            fi
            exit 0
          fi

          echo "::warning::$summary"
          printf '%s' "$failed"
          body="$summary after deploying $GITHUB_SHA ($run_url). Failing (HTTP status, Content-Type):"$'\n\n'"$failed"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still failing. $body"
          else
            gh issue create --title "$IMG_ISSUE_TITLE" --body "$body"$'\n'"Check that each file is in the S3 bucket at that key, with an image Content-Type, and that the bucket policy still allows the site's Referer. This issue closes itself once every image loads."
          fi

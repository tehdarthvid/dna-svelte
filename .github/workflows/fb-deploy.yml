name: Build and Deploy

# Ensure the following 3 items are defined/updated:
#   1. secret FIREBASE_SERVICE_ACCOUNT: JSON key of a service account with the
#      "Firebase Hosting Admin" role (replaces the deprecated FIREBASE_TOKEN)
#   2. secret FIREBASE_PROJECT_ID: Firebase Project to deploy to
#   3. secret GA_TRACKING_ID: Google Analytics tracking ID

#   4. Update source branch and other trigger filters.
on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!README.md"
      - "!.gitignore"
      - "!.gitattributes"
      - "!CHANGELOG.md"

jobs:
  fb-deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out ${{ github.ref }}
        uses: actions/checkout@v4

      - name: Build ${{ github.ref }}
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
        run: |
          npm install
          npm run build

      - name: Install Firebase-CLI
        run: |
          npm install firebase-tools

      - name: Deploy "public" to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export PATH="./node_modules/.bin:$PATH"
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only hosting --project "${{ secrets.FIREBASE_PROJECT_ID }}" -m "built from ${{ github.sha }}"
          rm -f "$RUNNER_TEMP/sa.json"

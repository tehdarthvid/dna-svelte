name: Upload card images to S3

# Gets card images into the S3 bucket without AWS keys anywhere: a push to an
# s3-upload/<slug> branch (claude-experiments + one commit adding .s3-upload/ditim/...)
# runs scripts/s3-upload.sh with short-lived credentials from GitHub OIDC, then
# deletes the branch so the images stay out of every kept branch's history.
#
# Needs (one-time setup by the owner in AWS CloudShell; see CLAUDE.md, Card image uploads):
#   - repo variable AWS_S3_UPLOAD_ROLE_ARN: the IAM role. Its trust policy accepts only
#     sub repo:tehdarthvid/dna-svelte:environment:s3-upload, aud sts.amazonaws.com.
#     Its only permission is s3:PutObject on ditim/full/* and ditim/thumbs/*, and it
#     denies any PutObject without If-None-Match (no overwrites).
#   - environment s3-upload, deployment branches limited to s3-upload/*, so no other
#     branch can get a token for the role.
on:
  push:
    branches:
      - 's3-upload/**'

permissions:
  contents: read

concurrency:
  group: s3-upload-${{ github.ref }}

jobs:
  upload:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: s3-upload
    permissions:
      contents: write # delete the staging branch afterwards
      id-token: write # OIDC token for AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate
        run: bash scripts/s3-upload.sh --dry-run

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_S3_UPLOAD_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-duration-seconds: 900

      - name: Upload and check
        run: |
          aws --version
          echo '### Uploaded (status, Content-Type with the site Referer)' >>"$GITHUB_STEP_SUMMARY"
          bash scripts/s3-upload.sh

      # only on success: a failed run keeps the branch, so the files can be fixed and pushed again
      - name: Delete staging branch
        run: git push origin --delete "$GITHUB_REF_NAME"

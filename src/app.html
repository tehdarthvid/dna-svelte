<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!--
			The CSP is set in vite.config.js (sveltekit({ csp })), not here. SvelteKit writes it as a
			<meta http-equiv> at the start of the head placeholder below, so the favicon comes after it.
		-->

		<meta name="viewport" content="width=device-width" />

		<title>darthvid DNA</title>

		%sveltekit.head%
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
	</head>

	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
